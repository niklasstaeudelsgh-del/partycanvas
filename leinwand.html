<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Leinwand</title></head>
<body class="canvas">
<header>
  <h1 id="title">Leinwand</h1>
  <a id="back">Zurück</a>
</header>
<div class="strip" id="strip">
  <div class="empty" id="empty"><h2>Noch ist die Leinwand leer</h2><p>Das erste Foto gehört dir.</p></div>
</div>
<div class="lightbox" id="lb"><img alt=""></div>
<script src="/js/common.js"></script>
<script>
const id = eventId();
$('#back').href = '/e/' + id;
loadEvent().then((ev) => { $('#title').textContent = ev.name; });

const seen = new Set();
const strip = $('#strip');

function frame(p) {
  const f = document.createElement('figure'); f.className = 'frame';
  const img = document.createElement('img'); img.src = p.url; img.alt = p.task || 'Foto'; img.loading = 'lazy';
  img.onclick = () => { $('#lb img').src = p.full; $('#lb').classList.add('open'); };
  f.append(img);
  if (p.task) { const c = document.createElement('figcaption'); c.textContent = p.task; f.append(c); }
  return f;
}
$('#lb').onclick = () => $('#lb').classList.remove('open');

async function refresh() {
  try {
    const photos = await api('/events/' + id + '/photos');
    const current = new Set(photos.map((p) => p.id));
    // gelöschte Fotos entfernen
    strip.querySelectorAll('.frame').forEach((el) => { if (!current.has(+el.dataset.id)) { seen.delete(+el.dataset.id); el.remove(); } });
    // neue Fotos vorne einfügen (älteste zuerst, damit die neuesten ganz links landen)
    const fresh = photos.filter((p) => !seen.has(p.id)).reverse();
    const firstLoad = seen.size === 0;
    for (const p of fresh) {
      seen.add(p.id);
      const el = frame(p); el.dataset.id = p.id;
      strip.prepend(el);
    }
    if (fresh.length && !firstLoad) strip.scrollTo({ left: 0, behavior: 'smooth' });
    $('#empty').hidden = strip.querySelectorAll('.frame').length > 0;
  } catch {}
}
refresh();
setInterval(refresh, 6000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body></html>
