<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Foto</title></head>
<body>
<main class="wrap">
  <a class="back" id="back">Zurück</a>

  <section id="s-choose">
    <h1>Welches Foto?</h1>
    <div class="stack">
      <button class="choice" id="normal"><strong>Normales Foto</strong><span>Einfach festhalten, was gerade passiert.</span></button>
      <button class="choice" id="party"><strong>Party-Foto</strong><span>Du bekommst eine Aufgabe per Zufall.</span></button>
    </div>
  </section>

  <section id="s-quest" hidden>
    <button class="quest-card idle" id="card" aria-live="polite">
      <div class="cat" id="cat"></div>
      <div class="txt" id="txt">Spin Quest</div>
      <div class="hint" id="hint">Tippen zum Drehen</div>
    </button>
    <div class="stack" id="quest-actions" hidden>
      <button class="btn block" id="accept">Aufgabe annehmen</button>
      <button class="btn ghost block" id="again">Nochmal drehen</button>
    </div>
  </section>

  <section id="s-shoot" hidden>
    <h1 id="shoot-title">Foto aufnehmen</h1>
    <div class="task-note" id="task-note" hidden></div>
    <img class="preview" id="preview" alt="Vorschau" hidden>
    <div class="stack">
      <button class="btn block" id="open">Kamera öffnen</button>
      <button class="btn block" id="send" hidden>Auf die Leinwand</button>
      <button class="btn ghost block" id="retake" hidden>Neu aufnehmen</button>
    </div>
    <p class="error" id="err"></p>
  </section>

  <section id="s-done" hidden>
    <h1>Gespeichert</h1>
    <p class="muted">Dein Foto hängt jetzt auf der Leinwand.</p>
    <div class="stack">
      <a class="btn block" id="to-wall">Zur Leinwand</a>
      <button class="btn ghost block" id="more">Noch ein Foto</button>
    </div>
  </section>

  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
</main>
<script src="/js/common.js"></script>
<script src="/js/tasks.js"></script>
<script>
const id = eventId();
$('#back').href = '/e/' + id;
$('#to-wall').href = '/e/' + id + '/leinwand';
loadEvent();

const sections = ['choose', 'quest', 'shoot', 'done'];
const show = (n) => sections.forEach((s) => { $('#s-' + s).hidden = s !== n; });

let task = null, file = null, spinning = false, last = -1;

$('#normal').onclick = () => { task = null; startShoot(); };
$('#party').onclick = () => { resetCard(); show('quest'); };

function resetCard() {
  const c = $('#card');
  c.className = 'quest-card idle';
  $('#cat').textContent = ''; $('#txt').textContent = 'Spin Quest'; $('#hint').textContent = 'Tippen zum Drehen';
  $('#quest-actions').hidden = true;
}

function pick() {
  let i; do { i = Math.floor(Math.random() * TASKS.length); } while (i === last && TASKS.length > 1);
  last = i; return TASKS[i];
}

$('#card').onclick = spin;
$('#again').onclick = spin;

function spin() {
  if (spinning) return;
  spinning = true;
  const c = $('#card');
  c.className = 'quest-card spinning';
  $('#quest-actions').hidden = true;
  $('#hint').textContent = '';
  const steps = 20; let i = 0;
  const tick = () => {
    const t = pick();
    $('#cat').textContent = t.c; $('#txt').textContent = t.t;
    if (i === steps) { // letzte Aufgabe bleibt stehen
      task = t.t; spinning = false;
      c.className = 'quest-card done';
      $('#hint').textContent = 'Deine Aufgabe';
      $('#quest-actions').hidden = false;
      if (navigator.vibrate) navigator.vibrate(60);
      return;
    }
    i++;
    setTimeout(tick, 60 + i * i * 0.5);
  };
  tick();
}

$('#accept').onclick = startShoot;

function startShoot() {
  file = null;
  $('#preview').hidden = true; $('#send').hidden = true; $('#retake').hidden = true; $('#open').hidden = false;
  $('#err').textContent = '';
  const note = $('#task-note');
  note.hidden = !task; note.textContent = task || '';
  $('#shoot-title').textContent = task ? 'Deine Aufgabe' : 'Foto aufnehmen';
  show('shoot');
}

$('#open').onclick = $('#retake').onclick = () => $('#cam').click();
$('#cam').onchange = (e) => {
  file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  $('#preview').src = URL.createObjectURL(file);
  $('#preview').hidden = false; $('#open').hidden = true; $('#send').hidden = false; $('#retake').hidden = false;
  $('#err').textContent = '';
};

$('#send').onclick = async () => {
  if (!file) return;
  const btn = $('#send'); btn.disabled = true; btn.textContent = 'Wird gespeichert …';
  try {
    const blob = await shrink(file);
    const fd = new FormData();
    fd.append('photo', blob, 'foto.jpg');
    if (task) fd.append('task', task);
    await api('/events/' + id + '/photos', { method: 'POST', body: fd });
    show('done');
  } catch (err) { $('#err').textContent = err.message + '. Bitte versuche es nochmal.'; }
  btn.disabled = false; btn.textContent = 'Auf die Leinwand';
};

$('#more').onclick = () => { task = null; file = null; show('choose'); };
</script>
</body></html>
