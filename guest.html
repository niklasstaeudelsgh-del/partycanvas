<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Feier</title></head>
<body>
<main class="wrap">
  <h1 id="title">&nbsp;</h1>
  <p class="muted">Was möchtest du tun?</p>
  <div class="stack">
    <a class="choice" id="foto"><strong>Foto</strong><span>Mach ein Foto oder nimm eine Party-Aufgabe an.</span></a>
    <a class="choice" id="wall"><strong>Leinwand</strong><span>Alle Fotos dieser Feier nebeneinander ansehen.</span></a>
  </div>
</main>
<script src="/js/common.js"></script>
<script>
const id = eventId();
$('#foto').href = '/e/' + id + '/foto';
$('#wall').href = '/e/' + id + '/leinwand';
loadEvent().then((ev) => { $('#title').textContent = ev.name; });
</script>
</body></html>
